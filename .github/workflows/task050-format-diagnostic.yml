name: Task050 Format Diagnostic
on:
  push:
    branches: ["builder/task050-format-diagnostic"]
    paths: [".github/workflows/task050-format-diagnostic.yml"]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event.head_commit.message == 'Run Task050 format diagnostic bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Install pinned Ruff only
        working-directory: backend
        run: python -m pip install --disable-pip-version-check ruff==0.12.12
      - name: Return exact formatter diff without writing repository state
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          ruff format tests/test_mega_client.py tests/test_session_resolve.py
          echo "TASK050_FORMAT_DIFF_BEGIN"
          git diff -- tests/test_mega_client.py tests/test_session_resolve.py
          echo "TASK050_FORMAT_DIFF_END"
