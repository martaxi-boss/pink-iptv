name: Android CI

on:
  push:
    branches:
      - "builder/**"
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
      - "PROJECT_STATE.md"
      - "README.md"
      - "docs/UX_STRUCTURE.md"
      - "docs/TEST_STRATEGY.md"
      - "design/BRAND_SYSTEM.md"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
      - "PROJECT_STATE.md"
      - "README.md"
      - "docs/UX_STRUCTURE.md"
      - "docs/TEST_STRATEGY.md"
      - "design/BRAND_SYSTEM.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Python for secret scan
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install secret scanner
        run: python -m pip install --disable-pip-version-check detect-secrets==1.5.0

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Git diff check
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          echo "GIT_DIFF_CHECK=PASS"

      - name: Android lint
        working-directory: android
        run: ./gradlew --no-daemon lintDebug

      - name: Android JVM tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify WireGuard native payload
        shell: bash
        run: |
          set -euo pipefail
          WIREGUARD_AAR="$(find "$HOME/.gradle/caches/modules-2/files-2.1/com.wireguard.android/tunnel/1.0.20260102" -type f -name 'tunnel-1.0.20260102.aar' -print -quit)"
          if [ -z "$WIREGUARD_AAR" ] || [ ! -f "$WIREGUARD_AAR" ]; then
            echo "WIREGUARD_AAR_NOT_FOUND"
            exit 1
          fi
          python android/scripts/verify_wireguard_native_payload.py --aar "$WIREGUARD_AAR" --apk android/app/build/outputs/apk/debug/app-debug.apk

      - name: Compile Android instrumentation tests
        working-directory: android
        run: ./gradlew --no-daemon assembleDebugAndroidTest

      - name: Secret scan
        run: |
          detect-secrets scan --all-files --exclude-files '(^|/)(\.git|\.gradle|build|\.pytest_cache|\.ruff_cache)/' > /tmp/detect-secrets.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/detect-secrets.json").read_text())
          findings = [
              (path, item.get("line_number"), item.get("type"))
              for path, items in report.get("results", {}).items()
              for item in items
          ]
          if findings:
              for path, line, kind in findings:
                  print(f"potential secret: {path}:{line} ({kind})")
              raise SystemExit(1)
          print("detect-secrets: no findings")
          PY

  phone-device-proof:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: phone-device-proof-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify KVM
        run: |
          set -euo pipefail
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          echo "PHONE_KVM=PASS"

      - name: Build phone proof APKs
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Free runner disk for phone proof
        run: |
          set -euo pipefail

          echo "DISK_BEFORE_CLEANUP"
          df -h /
          du -sh "$ANDROID_HOME" 2>/dev/null || true

          # Remove only preinstalled GitHub-hosted-runner components that are
          # irrelevant to this Android project. Keep JDK 17, Gradle state,
          # platform-tools, emulator, platform 36, build-tools 36.0.0, checkout,
          # and the APK/androidTest outputs built above.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/CodeQL"
          sudo rm -rf "$ANDROID_HOME/ndk"
          sudo rm -rf "$ANDROID_HOME/cmake"
          sudo rm -rf "$ANDROID_HOME/system-images"

          docker system prune -af --volumes 2>/dev/null || true
          sudo apt-get clean

          echo "DISK_AFTER_CLEANUP"
          df -h /

          echo "DISK_BEFORE_EMULATOR"
          df -h /
          FREE_BYTES="$(df --output=avail -B1 / | tail -n 1 | tr -d ' ')"
          REQUIRED_BYTES="$((12 * 1024 * 1024 * 1024))"
          echo "PHONE_RUNNER_FREE_BYTES=$FREE_BYTES"
          echo "PHONE_RUNNER_REQUIRED_BYTES=$REQUIRED_BYTES"
          if [ "$FREE_BYTES" -lt "$REQUIRED_BYTES" ]; then
            echo "PHONE_RUNNER_DISK_INSUFFICIENT"
            exit 1
          fi
          echo "PHONE_RUNNER_DISK_GATE=PASS"

      - name: Prepare phone device proof script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/pink-phone-device-proof.sh" <<'PINK_PHONE_PROOF'
          #!/usr/bin/env bash
          set -euo pipefail

          PHONE_API="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          echo "PHONE_API=$PHONE_API"
          test "$PHONE_API" = "36"
          test -r /dev/kvm
          test -w /dev/kvm
          echo "PHONE_KVM=PASS"

          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm path com.pinkiptv.app | grep -q '^package:'
          adb shell pm path com.pinkiptv.app.test | grep -q '^package:'
          echo "PHONE_INSTALL=PASS"

          INSTRUMENTATION_COMPONENT="com.pinkiptv.app.test/androidx.test.runner.AndroidJUnitRunner"
          INSTRUMENTATION_TARGET="com.pinkiptv.app"
          INSTRUMENTATIONS="$(adb shell pm list instrumentation | tr -d '\r')"
          printf '%s\n' "$INSTRUMENTATIONS"
          EXPECTED_INSTRUMENTATION="instrumentation:$INSTRUMENTATION_COMPONENT (target=$INSTRUMENTATION_TARGET)"
          if ! printf '%s\n' "$INSTRUMENTATIONS" | grep -Fqx "$EXPECTED_INSTRUMENTATION"; then
            echo "PHONE_INSTRUMENTATION_RUNNER_MISSING"
            exit 1
          fi
          echo "PHONE_INSTRUMENTATION_COMPONENT=$INSTRUMENTATION_COMPONENT"
          echo "PHONE_INSTRUMENTATION_TARGET=$INSTRUMENTATION_TARGET"

          run_phone_test() {
            local full_class="$1"
            local short_class="${full_class##*.}"
            local output_file="$RUNNER_TEMP/phone-${short_class}.txt"

            adb shell am instrument -w -r \
              -e class "$full_class" \
              "$INSTRUMENTATION_COMPONENT" | tee "$output_file"

            if ! grep -Fq "$full_class" "$output_file"; then
              echo "PHONE_TEST_CLASS_NOT_IDENTIFIED=$full_class"
              exit 1
            fi

            if grep -Eq 'INSTRUMENTATION_FAILED|FAILURES!!!|Process crashed|INSTRUMENTATION_STATUS_CODE: -[0-9]+' "$output_file"; then
              echo "PHONE_TEST_FAILED=$full_class"
              exit 1
            fi

            if ! grep -Fq 'INSTRUMENTATION_CODE: -1' "$output_file"; then
              echo "PHONE_TEST_COMPLETION_MISSING=$full_class"
              exit 1
            fi

            echo "${short_class}=PASS"
          }

          run_phone_test "com.pinkiptv.app.MainActivityStartupTest"
          run_phone_test "com.pinkiptv.app.LoginScreenTest"
          run_phone_test "com.pinkiptv.app.NavigationShellTest"
          run_phone_test "com.pinkiptv.app.AndroidKeystoreCredentialStoreTest"
          run_phone_test "com.pinkiptv.app.WireGuardNativeSmokeTest"
          run_phone_test "com.pinkiptv.app.WireGuardIdentityStoreTest"
          run_phone_test "com.pinkiptv.app.WireGuardManifestPolicyTest"
          run_phone_test "com.pinkiptv.app.VpnSettingsDpadTest"
          echo "WG_GO_LOAD=PASS"
          echo "WG_GO_VERSION_NONEMPTY=PASS"
          echo "WG_IDENTITY_KEYSTORE=PASS"
          echo "WG_MANIFEST_POLICY=PASS"
          echo "WG_SETTINGS_DPAD=PASS"

          cat \
            "$RUNNER_TEMP/phone-MainActivityStartupTest.txt" \
            "$RUNNER_TEMP/phone-LoginScreenTest.txt" \
            "$RUNNER_TEMP/phone-NavigationShellTest.txt" \
            "$RUNNER_TEMP/phone-AndroidKeystoreCredentialStoreTest.txt" \
            "$RUNNER_TEMP/phone-WireGuardNativeSmokeTest.txt" \
            "$RUNNER_TEMP/phone-WireGuardIdentityStoreTest.txt" \
            "$RUNNER_TEMP/phone-WireGuardManifestPolicyTest.txt" \
            "$RUNNER_TEMP/phone-VpnSettingsDpadTest.txt" \
            > "$RUNNER_TEMP/phone-instrumentation-all.txt"

          if grep -Eq 'TvLoginDpadTest|HomeScreenTest' "$RUNNER_TEMP/phone-instrumentation-all.txt"; then
            echo "PHONE_TV_TESTS_NOT_EXCLUDED"
            exit 1
          fi

          echo "PHONE_TV_TESTS_EXCLUDED=PASS"
          echo "PHONE_INSTRUMENTATION=PASS"
          echo "PHONE_KEYSTORE=PASS"

          adb install -r app/build/outputs/apk/debug/app-debug.apk >/dev/null
          adb shell am force-stop com.pinkiptv.app
          adb logcat -c

          LAUNCH_RESULT="$(adb shell am start -W -n com.pinkiptv.app/.MainActivity)"
          printf '%s\n' "$LAUNCH_RESULT"
          printf '%s\n' "$LAUNCH_RESULT" | grep -q 'Status: ok'
          sleep 2
          adb shell pidof com.pinkiptv.app >/dev/null

          adb logcat -d -v threadtime > /tmp/pink-phone-logcat.txt
          if grep -Eq 'ANR in com\.pinkiptv\.app|Process: com\.pinkiptv\.app' /tmp/pink-phone-logcat.txt; then
            echo "PHONE_CRASH_ANR=DETECTED"
            grep -E -C 8 'ANR in com\.pinkiptv\.app|Process: com\.pinkiptv\.app' /tmp/pink-phone-logcat.txt
            exit 1
          fi

          echo "PHONE_LAUNCH_SMOKE=PASS"
          echo "PHONE_CRASH_ANR=NONE"
          echo "PHONE_DEVICE_PROOF=PASS"
          PINK_PHONE_PROOF
          chmod +x "$RUNNER_TEMP/pink-phone-device-proof.sh"

      - name: Run phone device proof
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          disable-linux-hw-accel: false
          enable-hw-keyboard: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: bash "$RUNNER_TEMP/pink-phone-device-proof.sh"


  wireguard-api24-smoke:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: wireguard-api24-smoke-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify KVM
        run: |
          set -euo pipefail
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
          test -w /dev/kvm
          echo "WG_API24_KVM=PASS"

      - name: Build API24 smoke APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Prepare API24 smoke script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/pink-wireguard-api24-smoke.sh" <<'PINK_WG_API24'
          #!/usr/bin/env bash
          set -euo pipefail

          API="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          echo "WG_API24_VALUE=$API"
          test "$API" = "24"

          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          echo "WG_API24_INSTALL=PASS"

          INSTRUMENTATION_COMPONENT="com.pinkiptv.app.test/androidx.test.runner.AndroidJUnitRunner"

          run_api24_test() {
            local full_class="$1"
            local short_class="${full_class##*.}"
            local output_file="$RUNNER_TEMP/api24-${short_class}.txt"

            adb shell am instrument -w -r \
              -e class "$full_class" \
              "$INSTRUMENTATION_COMPONENT" | tee "$output_file"

            grep -Fq "$full_class" "$output_file"
            ! grep -Eq 'INSTRUMENTATION_FAILED|FAILURES!!!|Process crashed|INSTRUMENTATION_STATUS_CODE: -[0-9]+' "$output_file"
            grep -Fq 'INSTRUMENTATION_CODE: -1' "$output_file"
            echo "${short_class}=PASS"
          }

          run_api24_test "com.pinkiptv.app.MainActivityStartupTest"
          echo "WG_API24_APP_START=PASS"

          run_api24_test "com.pinkiptv.app.WireGuardNativeSmokeTest"
          echo "WG_API24_NATIVE=PASS"

          run_api24_test "com.pinkiptv.app.WireGuardIdentityStoreTest"
          echo "WG_API24_KEYSTORE=PASS"

          run_api24_test "com.pinkiptv.app.WireGuardManifestPolicyTest"
          echo "WG_API24_MANIFEST=PASS"

          adb shell am force-stop com.pinkiptv.app
          adb logcat -c
          adb shell am start -W -n com.pinkiptv.app/.MainActivity | tee "$RUNNER_TEMP/api24-launch.txt"
          grep -q 'Status: ok' "$RUNNER_TEMP/api24-launch.txt"
          sleep 2
          adb shell pidof com.pinkiptv.app >/dev/null

          adb logcat -d -v threadtime > "$RUNNER_TEMP/api24-logcat.txt"
          if grep -Eq 'ANR in com\.pinkiptv\.app|Process: com\.pinkiptv\.app' "$RUNNER_TEMP/api24-logcat.txt"; then
            echo "WG_API24_CRASH_ANR=DETECTED"
            exit 1
          fi

          echo "WG_API24_CRASH_ANR=NONE"
          echo "WG_API24=PASS"
          PINK_WG_API24
          chmod +x "$RUNNER_TEMP/pink-wireguard-api24-smoke.sh"

      - name: Run API24 WireGuard smoke
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 24
          target: default
          arch: x86
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disk-size: 3072M
          disable-linux-hw-accel: false
          enable-hw-keyboard: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: bash "$RUNNER_TEMP/pink-wireguard-api24-smoke.sh"
