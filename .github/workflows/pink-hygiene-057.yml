name: PINK repository hygiene 057
on:
  push:
    branches: ["archive/legacy-branches-20261016"]
    paths: ["ops/pink_hygiene_057.py", "ops/pink_actions_artifact_hygiene.py", ".github/workflows/pink-hygiene-057.yml", ".project-leader/transitions/PINK-IPTV-ARTIFACT-HYGIENE-20261016.authorization.json", ".project-leader/transitions/PINK-IPTV-FINAL-20261016.authorization.json"]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  inventory:
    if: github.event.head_commit.message == 'Run archived branch inventory'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Read bounded public ref evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ops/pink_hygiene_057.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PINK-hygiene-057-inventory
          path: pink-hygiene-057-inventory.json
  cleanup:
    if: github.event.head_commit.message == 'Execute exact archived PINK branch cleanup'
    permissions:
      contents: write
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Execute exactly 49 archived, owner-authorized branch ref removals
        env:
          GH_TOKEN: ${{ github.token }}
          PINK_HYGIENE_EXECUTE: "1"
        run: python ops/pink_hygiene_057.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: PINK-hygiene-057-result
          path: pink-hygiene-057-result.json

  artifact-inventory:
    if: github.event.head_commit.message == 'Inventory outdated PINK artifacts'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inventory only old Actions artifacts without deletion
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ops/pink_actions_artifact_hygiene.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: PINK-final-artifact-inventory
          path: pink-artifact-inventory.json

  artifact-cleanup:
    if: github.event.head_commit.message == 'Execute exact archived PINK artifact cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    concurrency:
      group: pink-final-exact-artifact-cleanup
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate exact-scoped cleanup script before any deletion
        run: python3 -m py_compile ops/pink_actions_artifact_hygiene.py
      - name: Remove only SHA256-authorized historical test artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PINK_ARTIFACT_DELETE: "1"
        run: python3 ops/pink_actions_artifact_hygiene.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: PINK-final-artifact-cleanup-result
          path: pink-artifact-cleanup-result.json
