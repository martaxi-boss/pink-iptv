name: PINK Extreme Android 042
on:
  push:
    branches: ["builder/extreme-live-certification-055"]
    paths: ["clients/extreme/**", ".github/workflows/pink-extreme-042.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      XT_SKIP_FFMPEG_SIDECAR: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.31.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;29.0.13846066"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Prepare complete pinned upstream application
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/infinitel8p/Extreme-InfiniTV.git "$RUNNER_TEMP/pink-extreme"
          git -C "$RUNNER_TEMP/pink-extreme" checkout --detach 1efcc1b4ab3468db04aedd1c466228c52ef001b7
          python clients/extreme/prepare.py "$RUNNER_TEMP/pink-extreme"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: "${{ runner.temp }}/pink-extreme/src-tauri -> target"
          key: pink-extreme-043
      - name: Install and verify login contract
        working-directory: ${{ runner.temp }}/pink-extreme
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run tests/pink-session.test.ts tests/pink-storage.test.ts tests/pink-network.test.ts tests/stall-watchdog.test.ts tests/vod-remux-memory.test.ts
          pnpm run build
      - name: Generate PINK launcher resources
        working-directory: ${{ runner.temp }}/pink-extreme
        run: |
          pnpm tauri icon "$GITHUB_WORKSPACE/clients/extreme/assets/pink-icon.png"
      - name: Build installable Android APK
        working-directory: ${{ runner.temp }}/pink-extreme
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13846066
        run: pnpm tauri android build --debug --apk --target aarch64 --target armv7 --target x86_64
      - name: Compile instrumentation and verify Android native payload
        working-directory: ${{ runner.temp }}/pink-extreme/src-tauri/gen/android
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13846066
        run: |
          ./gradlew --no-daemon app:assembleUniversalDebugAndroidTest app:testUniversalDebugUnitTest -x app:rustBuildUniversalDebug
          python - <<'PY'
          from pathlib import Path
          import zipfile
          apks = list(Path('app/build/outputs/apk').rglob('*debug*.apk'))
          candidates = [p for p in apks if 'androidTest' not in str(p)]
          assert candidates
          for path in candidates:
              with zipfile.ZipFile(path) as apk:
                  names = apk.namelist()
                  assert any(n.endswith('/libwg-go.so') for n in names)
                  assert not any(n.endswith('/libwg.so') or n.endswith('/libwg-quick.so') for n in names)
          print('OFFICIAL_NON_ROOT_PAYLOAD=PASS')
          PY
      - name: Prepare real Android emulator verification
        run: |
          set -euo pipefail
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=10
          test -r /dev/kvm
          test -w /dev/kvm
          cat > "$RUNNER_TEMP/pink053-emulator.sh" <<'SCRIPT'
          set -euo pipefail
          adb install -r app/build/outputs/apk/universal/debug/app-universal-debug.apk
          adb install -r app/build/outputs/apk/androidTest/universal/debug/app-universal-debug-androidTest.apk
          adb shell am instrument -w -r -e class com.pinkiptv.extreme.PinkVpnIdentityTest com.pinkiptv.extreme.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/pink053-identity.txt"
          cat "$RUNNER_TEMP/pink053-identity.txt"
          grep -q 'OK (2 tests)' "$RUNNER_TEMP/pink053-identity.txt"
          adb shell am instrument -w -r -e class com.pinkiptv.extreme.PinkVpnStartupTest com.pinkiptv.extreme.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/pink053-startup.txt"
          cat "$RUNNER_TEMP/pink053-startup.txt"
          grep -q 'OK (1 test)' "$RUNNER_TEMP/pink053-startup.txt"
          echo KEYSTORE_NORMAL_CONSENT_OFFLINE_FAIL_CLOSED_RECREATION=PASS
          SCRIPT
      - name: Real Android Keystore, normal VPN consent and startup capture
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: ${{ runner.temp }}/pink-extreme/src-tauri/gen/android
          script: bash "$RUNNER_TEMP/pink053-emulator.sh"
      - name: PINK source privacy scan
        run: | # pragma: allowlist secret -- scan tool invocation, no credential value
          python -m pip install --disable-pip-version-check detect-secrets==1.5.0
          detect-secrets scan --all-files --exclude-files '(^|/)(\.git|\.pytest_cache|\.ruff_cache|.*egg-info)/' > /tmp/pink-extreme-scan.json
          python .github/scripts/filter_scan_findings.py /tmp/pink-extreme-scan.json
      - name: Package exact source, APK and integrity hashes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pink-deliverable"
          APK=$(find "$RUNNER_TEMP/pink-extreme/src-tauri/gen/android/app/build/outputs/apk" -name '*universal*debug*.apk' -print -quit)
          if [ -z "$APK" ]; then
            APK=$(find "$RUNNER_TEMP/pink-extreme/src-tauri/gen/android/app/build/outputs/apk" -name '*debug*.apk' -print -quit)
          fi
          test -n "$APK"
          cp "$APK" "$RUNNER_TEMP/pink-deliverable/PINK-IPTV-Extreme-1.9.0-debug.apk"
          tar --exclude='.git' --exclude='node_modules' --exclude='target' --exclude='build' --exclude='.gradle' --exclude='dist' --exclude='__pycache__' -czf "$RUNNER_TEMP/pink-deliverable/PINK-IPTV-Extreme-source.tar.gz" -C "$RUNNER_TEMP" pink-extreme
          cp -r clients/extreme "$RUNNER_TEMP/pink-deliverable/rebuild-recipe"
          find "$RUNNER_TEMP/pink-deliverable/rebuild-recipe" -type d -name __pycache__ -prune -exec rm -rf {} +
          cd "$RUNNER_TEMP/pink-deliverable"
          printf '{"implementation_sha":"%s","upstream_sha":"1efcc1b4ab3468db04aedd1c466228c52ef001b7"}\n' "$GITHUB_SHA" > provenance.json
          sha256sum *.apk *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PINK-IPTV-Extreme-042
          path: ${{ runner.temp }}/pink-deliverable
          if-no-files-found: error
          retention-days: 30
