name: PINK repository hygiene 057
on:
  push:
    branches: ["builder/repository-hygiene-057"]
    paths: ["ops/pink_hygiene_057.py", ".github/workflows/pink-hygiene-057.yml", ".project-leader/transitions/PINK-IPTV-REPOSITORY-HYGIENE-057-DELETE-*"]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  inventory:
    if: github.event.head_commit.message != 'Execute exact merged branch cleanup 057'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Read bounded public ref evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ops/pink_hygiene_057.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PINK-hygiene-057-inventory
          path: pink-hygiene-057-inventory.json
  cleanup:
    if: github.event.head_commit.message == 'Execute exact merged branch cleanup 057'
    permissions:
      contents: write
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Execute only exact previously authorized refs
        env:
          GH_TOKEN: ${{ github.token }}
          PINK_HYGIENE_EXECUTE: "1"
        run: python ops/pink_hygiene_057.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PINK-hygiene-057-result
          path: pink-hygiene-057-result.json
