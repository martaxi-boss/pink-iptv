# Verified read-only inventory 37999614152: all 10 listed refs merged into pinned main.
name: PINK exact merged-ref hygiene 088
on:
  push:
    branches: ["control/pink-efficiency-hygiene-088"]
    paths: ["ops/pink_hygiene_088.py", ".github/workflows/pink-hygiene-088.yml", ".project-leader/transitions/PINK-IPTV-REPOSITORY-HYGIENE-088-DELETE-*"]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  inventory:
    if: github.event.head_commit.message != 'Execute exact merged branch cleanup 088'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Read bounded public ref evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ops/pink_hygiene_088.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PINK-hygiene-057-inventory
          path: pink-hygiene-088-inventory.json
  cleanup:
    if: github.event.head_commit.message == 'Execute exact merged branch cleanup 088'
    permissions:
      contents: write
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Execute only exact previously authorized refs
        env:
          GH_TOKEN: ${{ github.token }}
          PINK_HYGIENE_EXECUTE: "1"
        run: python ops/pink_hygiene_088.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PINK-hygiene-057-result
          path: pink-hygiene-088-result.json
