name: PINK Android Owner QA2 087
on:
  pull_request:
    branches: ["main"]
    paths:
      - "clients/extreme/qa_variant.py"
      - "clients/extreme/test_qa_variant.py"
      - "clients/extreme/scan_qa_repo.py"
      - "clients/extreme/QA_ANDROID_TEST_083.md"
      - ".github/workflows/pink-android-side-by-side-qa-083.yml"
permissions:
  contents: read
# Only one E1 Android QA build can certify the newest head of this PR.
# Preserve a previous diagnostic run by labelling the PR before the next push.
concurrency:
  group: pink-owner-qa2-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ !contains(github.event.pull_request.labels.*.name, 'keep-older-qa-diagnostics') }}
jobs:
  qa-android:
    if: github.event_name == 'pull_request' && github.head_ref == 'builder/side-by-side-android-qa-083' && github.event.pull_request.head.repo.full_name == 'martaxi-boss/pink-iptv'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      XT_SKIP_FFMPEG_SIDECAR: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fast-check package separation before expensive builds
        run: |
          set -euo pipefail
          python3 -m py_compile clients/extreme/qa_variant.py clients/extreme/test_qa_variant.py
          python3 clients/extreme/test_qa_variant.py
          python3 clients/extreme/test_brand_overlay.py
          python3 clients/extreme/test_owner_menu_recovery.py
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base = "a6c5b7e73b2d7014b927acd47b9f4c2d633ad7c7"
          subprocess.run(["git","merge-base","--is-ancestor",base,"HEAD"],check=True)
          changed = set(subprocess.check_output(
              ["git","diff","--name-only",base,"HEAD"],text=True).splitlines())
          allowed = {
              "clients/extreme/qa_variant.py",
              "clients/extreme/test_qa_variant.py",
              "clients/extreme/scan_qa_repo.py",
              "clients/extreme/QA_ANDROID_TEST_083.md",
              ".github/workflows/pink-android-side-by-side-qa-083.yml",
              "clients/extreme/vpn_overlay.py",
              "clients/extreme/vod_overlay.py",
              "clients/extreme/overlay/pink-bridge.js",
              "clients/extreme/overlay/PinkWebBridge.kt",
              "clients/extreme/prepare.py",
              "clients/extreme/overlay/PinkCatalog.kt",
              "clients/extreme/overlay/pink-catalog.js",
              "clients/extreme/overlay/vpn/PinkVodCatalog.kt",
              "clients/extreme/overlay/vpn-jvm/PinkVodCatalogTest.kt",
              "clients/extreme/overlay/pink-catalog.test.ts",
              "clients/extreme/overlay/pink-catalog-diagnostic.js",
              "clients/extreme/overlay/pink-catalog-diagnostic.test.ts",
              "clients/extreme/overlay/pink-catalog-browser.mjs",
              "clients/extreme/overlay/vpn-tests/PinkCatalogTransportChecks.kt",
              "clients/extreme/overlay/vpn-tests/PinkVodTracksChecks.kt",
              "clients/extreme/overlay/vpn-jvm/PinkCatalogPolicyTest.kt",
              "clients/extreme/overlay/pink-screen-cast.js",
              "clients/extreme/overlay/pink-screen-cast.test.ts",
              "clients/extreme/test_owner_menu_recovery.py",
          }
          assert changed and changed <= allowed, sorted(changed - allowed)
          print("PINK083_ORIGINAL_INSTALLED_APK_PACKAGE_UNCHANGED=PASS")
          PY
      - name: Run complete committed source security scan before Android build
        run: |
          set -euo pipefail
          python3 -m py_compile clients/extreme/scan_qa_repo.py
          python3 clients/extreme/scan_qa_repo.py
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.31.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;29.0.13846066"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Prepare exact pinned upstream with complete PINK overlay
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/infinitel8p/Extreme-InfiniTV.git "$RUNNER_TEMP/pink-extreme"
          git -C "$RUNNER_TEMP/pink-extreme" checkout --detach 1efcc1b4ab3468db04aedd1c466228c52ef001b7
          python3 clients/extreme/prepare.py "$RUNNER_TEMP/pink-extreme"
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["RUNNER_TEMP"]) / "pink-extreme"
          live = (root / "src/pages/livetv.astro").read_text()
          assert 'id="current"' in live and 'id="epg"' in live
          assert 'id="epg-expand-toggle"' in live
          assert ":global(#current), :global(#epg)" not in live
          assert (root / "public/pink-idle.webp").is_file()
          for name in ("movies", "series"):
              page = (root / f"src/pages/{name}/index.astro").read_text()
              assert page.count('src="/pink-idle.webp"') == 1
          live_menu = (root / "src/scripts/stream/stream.ts").read_text()
          assert live_menu.count('import("@/scripts/lib/pink-screen-cast.js")') == 2
          vod_btn = (root / "src/scripts/lib/play-on-tv-button.ts").read_text()
          assert 'openPinkCastSettings' in vod_btn and 'button.hidden = true' not in vod_btn
          native_video = (root / "src-tauri/gen/android/app/src/main/java/com/pinkiptv/extreme/VideoActivity.kt").read_text()
          assert 'pink_video_cast_screen' in native_video and 'pink_video_picture_in_picture' in native_video
          assert (root / "src/scripts/lib/pink-screen-cast.js").is_file()
          assert 'findViewById<View>(R.id.pink_more_actions)' in native_video
          native_controller = (root / "src-tauri/gen/android/app/src/main/res/layout/player_controller_tv.xml").read_text()
          assert 'android:id="@+id/pink_more_actions"' in native_controller
          assert 'android:contentDescription="@string/pink_video_more_actions"' in native_controller
          print("PINK083_OWNER_LIVE_MOVIES_SERIES_MENUS_PRESENT=PASS")
          print("PINK083_QA_APK_LIVE_OFF_EPG_AND_THREE_MENU_BRAND=PASS")
          PY
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: "${{ runner.temp }}/pink-extreme/src-tauri -> target"
          key: pink-extreme-043-ubuntu22
          cache-on-failure: "true"
      - name: Run complete protected frontend and bridge regressions
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pink-extreme"
          pnpm install --frozen-lockfile
          pnpm exec vitest run tests/pink-session.test.ts tests/pink-storage.test.ts tests/pink-home.test.ts tests/pink-login.test.ts tests/pink-network.test.ts tests/pink-bridge.test.ts tests/pink-catalog.test.ts tests/pink-catalog-pipeline.test.ts tests/pink-catalog-diagnostic.test.ts tests/pink-presentation.test.ts tests/pink-runtime-policy.test.ts tests/pink-screen-cast.test.ts tests/pink-vod.test.ts tests/android-video-launcher.test.ts tests/stall-watchdog.test.ts tests/vod-remux-memory.test.ts
          pnpm exec playwright install --with-deps chromium
          node tests/pink-catalog-browser.mjs
          pnpm run build
          python3 - <<'PY'
          from pathlib import Path
          workers = list(Path('dist/_astro').glob('pink-catalog-worker-*.js'))
          assert len(workers) == 1
          target = Path('src-tauri/gen/android/app/src/androidTest/assets/pink-catalog-worker-path.txt')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text('/_astro/' + workers[0].name)
          PY
      - name: Generate deterministic native multi-track test media
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          }
          python3 clients/extreme/generate_vod_test_media.py "$RUNNER_TEMP/pink-extreme/src-tauri/gen/android/app/src/androidTest/assets/pink-vod"
      - name: Generate launcher icons and apply QA-only package suffix
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pink-extreme"
          pnpm tauri icon "$GITHUB_WORKSPACE/clients/extreme/assets/pink-icon.png"
          cd "$GITHUB_WORKSPACE"
          python3 clients/extreme/qa_variant.py "$RUNNER_TEMP/pink-extreme"
      - name: Build complete Android QA APK from identical application source
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pink-extreme"
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.13846066"
          pnpm tauri android build --debug --apk --target aarch64 --target armv7 --target x86_64
      - name: Restore opt-in QA debug identity after Tauri Android synchronization
        timeout-minutes: 8
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/pink-extreme/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          test -s "$apk"
          # Only print non-secret public Android identifiers, so a future
          # Tauri regeneration mismatch is diagnosed without another blind run.
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" \
            | grep -E '^(package:|application-label:)' | head -n 4
          python3 clients/extreme/qa_variant.py "$RUNNER_TEMP/pink-extreme" --postbuild
          cd "$RUNNER_TEMP/pink-extreme/src-tauri/gen/android"
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.13846066"
          # Native Rust payload is already compiled. Rebuild only the Android
          # debug package so its final manifest/resources use the QA identity.
          ./gradlew --no-daemon app:assembleUniversalDebug -x app:rustBuildUniversalDebug
      - name: Compile native instrumentation and inspect official non-root WireGuard
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pink-extreme/src-tauri/gen/android"
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.13846066"
          ./gradlew --no-daemon app:assembleUniversalDebugAndroidTest app:testUniversalDebugUnitTest -x app:rustBuildUniversalDebug
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk=Path('app/build/outputs/apk/universal/debug/app-universal-debug.apk')
          assert apk.is_file()
          with ZipFile(apk) as item:
              names = item.namelist()
              assert any(s.endswith('/libwg-go.so') for s in names)
              assert not any(s.endswith('/libwg.so') or s.endswith('/libwg-quick.so') for s in names)
          print('PINK083_OFFICIAL_UNPRIVILEGED_WIREGUARD=PASS')
          PY
      - name: Fail closed if APK package is not distinct from installed PINK IPTV
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/pink-extreme/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/pink083-badging.txt"
          grep -E '^(package:|application-label:)' "$RUNNER_TEMP/pink083-badging.txt" | head -n 4
          grep -Fq "package: name='com.pinkiptv.extreme.qa2'" "$RUNNER_TEMP/pink083-badging.txt"
          grep -Fq "application-label:'PINK IPTV TESTE 2'" "$RUNNER_TEMP/pink083-badging.txt"
          ! grep -Fq "package: name='com.pinkiptv.extreme.qa'" "$RUNNER_TEMP/pink083-badging.txt"
          ! grep -Fq "package: name='com.pinkiptv.extreme'" "$RUNNER_TEMP/pink083-badging.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/pink083-signature.txt"
          echo 'PINK083_DISTINCT_PACKAGE_AND_SIGNED_TEST_APK=PASS'
      - name: Set up actual Android emulator instrumented acceptance
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/pink-extreme/src-tauri/gen/android" && ./gradlew --stop)
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=10
          test -r /dev/kvm
          test -w /dev/kvm
          cat > "$RUNNER_TEMP/pink083-emulator.sh" <<'SCRIPT'
          set -euo pipefail
          apk="app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          test_runner="com.pinkiptv.extreme.qa2.test/androidx.test.runner.AndroidJUnitRunner"
          adb install -r "$apk"
          adb shell pm list packages | grep -Fxq 'package:com.pinkiptv.extreme.qa2'
          adb install -r app/build/outputs/apk/androidTest/universal/debug/app-universal-debug-androidTest.apk
          adb shell am instrument -w -r -e class com.pinkiptv.extreme.PinkVpnIdentityTest "$test_runner" > "$RUNNER_TEMP/pink083-identity.txt"
          cat "$RUNNER_TEMP/pink083-identity.txt"
          grep -q 'OK (2 tests)' "$RUNNER_TEMP/pink083-identity.txt"
          adb shell am instrument -w -r -e class com.pinkiptv.extreme.PinkWebBridgeTest "$test_runner" > "$RUNNER_TEMP/pink083-bridge.txt"
          cat "$RUNNER_TEMP/pink083-bridge.txt"
          grep -q 'OK (2 tests)' "$RUNNER_TEMP/pink083-bridge.txt"
          grep -q 'PINK_ANDROID_HTTP_STAGE_WEBMESSAGE=PASS;ACTIONS=4;ROWS=20000;GZIP_CHUNKED=PASS' "$RUNNER_TEMP/pink083-bridge.txt"
          adb shell am instrument -w -r -e waitForActivitiesToComplete false -e class com.pinkiptv.extreme.PinkVpnStartupTest "$test_runner" > "$RUNNER_TEMP/pink083-startup.txt"
          cat "$RUNNER_TEMP/pink083-startup.txt"
          if ! grep -q 'OK (1 test)' "$RUNNER_TEMP/pink083-startup.txt"; then
            adb logcat -b crash -d -t 100
            adb shell ip -4 rule
            adb shell ip -6 rule
            adb shell ip -4 route show table all
            adb shell ip -6 route show table all
          fi
          grep -q 'OK (1 test)' "$RUNNER_TEMP/pink083-startup.txt"
          grep -q 'PINK_ANDROID_CATALOG_WORKER=PASS;ROWS=10000' "$RUNNER_TEMP/pink083-startup.txt"
          grep -q 'REAL_MEDIA3_MULTI_AUDIO_MULTI_SUBTITLE_FORCED_SELECTION_AND_PRESENTED_VIDEO=PASS' "$RUNNER_TEMP/pink083-startup.txt"
          grep -q 'REAL_MEDIA3_SINGLE_AUDIO_NO_SUBTITLES_AND_PROTECTED_LAUNCH_FALLBACK=PASS' "$RUNNER_TEMP/pink083-startup.txt"
          grep -q 'PINK_ANDROID_NATIVE_DOTS_MENU_PIP_CAST_AND_REAL_DISPLAY_MODE=PASS' "$RUNNER_TEMP/pink083-startup.txt"
          grep -q 'PINK_ANDROID_NATIVE_OWNER_SEVEN_MENU_AND_AUDIO_TOGGLES=PASS' "$RUNNER_TEMP/pink083-startup.txt"
          adb shell am force-stop com.pinkiptv.extreme.qa2
          echo PINK083_KEYSTORE_VPN_CONSENT_FAIL_CLOSED_RECREATION=PASS
          SCRIPT
      - name: Android emulator Keystore and app-scoped VPN tests
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: "${{ runner.temp }}/pink-extreme/src-tauri/gen/android"
          script: bash "$RUNNER_TEMP/pink083-emulator.sh"
      - name: Verify Android lint
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pink-extreme/src-tauri/gen/android"
          ./gradlew --no-daemon app:lintUniversalDebug -x app:rustBuildUniversalDebug
      - name: Package one unmistakable QA-only signed APK with SHA and source
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/pink-extreme/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          folder="$GITHUB_WORKSPACE/clients/extreme/qa-deliverable"
          mkdir -p "$folder"
          cp "$apk" "$folder/PINK-IPTV-TESTE2.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$folder/PINK-IPTV-TESTE2.apk" > "$folder/package-check.txt"
          grep -Fq "package: name='com.pinkiptv.extreme.qa2'" "$folder/package-check.txt"
          grep -Fq "application-label:'PINK IPTV TESTE 2'" "$folder/package-check.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$folder/PINK-IPTV-TESTE2.apk" > "$folder/signing-check.txt"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          output=Path(os.environ["GITHUB_WORKSPACE"])/"clients/extreme/qa-deliverable"
          artifact=output/"PINK-IPTV-TESTE2.apk"
          sha=hashlib.sha256(artifact.read_bytes()).hexdigest()
          properties={
              "file":artifact.name,
              "application_id":"com.pinkiptv.extreme.qa2",
              "original_application_id":"com.pinkiptv.extreme",
              "previous_test_application_id":"com.pinkiptv.extreme.qa",
              "owner_physical_test_required":True,
              "android_debug_signing_not_stable_between_builds":True,
              "tv_stream_handoff_disabled_screen_mirroring_only":True,
              "source_sha":os.environ["GITHUB_SHA"],
              "github_run":int(os.environ["GITHUB_RUN_ID"]),
              "sha256":sha,
              "size_bytes":artifact.stat().st_size,
              "test_only":True,
              "production_release":False,
              "original_apk_must_not_be_uninstalled":True,
          }
          assert properties["application_id"] not in (properties["original_application_id"],properties["previous_test_application_id"])
          (output/"provenance.json").write_text(json.dumps(properties,indent=2)+"\n")
          (output/"SHA256SUMS").write_text(f"{sha}  {artifact.name}\n")
          print("PINK083_BOUND_DISTINCT_TEST_APK_SHA256="+sha)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PINK-IPTV-TESTE2-087
          path: clients/extreme/qa-deliverable
          if-no-files-found: error
          retention-days: 30
